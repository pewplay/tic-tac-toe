<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="./style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="icon.png" type="image/png">

</head>
<body>
<!-- partial:index.partial.html -->

<header>
    <h1>Tic Tac Toe</h1>
    <p>Turno di <span id="player-turn"></span></p>
  </header>
  <main id="gameboard">
    <div class="line r r-1"></div>
    <div class="line r r-2"></div>
    <div class="line c c-1"></div>
    <div class="line c c-2"></div>
  </main>
  <div id="num-of-players">
    <p>Giocatore singolo</p>
    <div id="toggle-switch">
      <div id="toggle-btn"></div>
    </div>
    <p>Vs</p>
  </div>
  <div id="gameover-msg">
    
    <button id="reset-btn"><h3 id="winner"></h3>Nuova partita</button>
  </div>
<!-- partial -->
  <script  src="./script.js"></script>

</body>
</html>
