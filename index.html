<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <h1>Tic Tac Toe</h1>
      <p id="status" aria-live="polite"><span id="status-mark" class="mark-chip x"></span><span id="status-text">Your turn</span></p>
    </header>

    <main id="board-wrap">
      <div id="gameboard" class="turn-x">
        <div class="line r r-1"></div>
        <div class="line r r-2"></div>
        <div class="line c c-1"></div>
        <div class="line c c-2"></div>
        <svg id="win-line" viewBox="0 0 300 300" aria-hidden="true"><line x1="0" y1="0" x2="0" y2="0"></line></svg>
        <div id="gameover-msg" class="hidden" role="dialog" aria-labelledby="winner">
          <h2 id="winner"></h2>
          <button type="button" id="reset-btn" class="btn primary">Play again</button>
        </div>
      </div>
    </main>

    <section id="panel">
      <div id="scores">
        <div class="score x"><span class="score-label" id="label-x">You (X)</span><span class="score-num" id="score-x">0</span></div>
        <div class="score d"><span class="score-label">Draws</span><span class="score-num" id="score-d">0</span></div>
        <div class="score o"><span class="score-label" id="label-o">Computer (O)</span><span class="score-num" id="score-o">0</span></div>
      </div>
      <div id="num-of-players" role="radiogroup" aria-label="Number of players">
        <button type="button" class="mode-btn" data-mode="1" role="radio">1 Player</button>
        <button type="button" class="mode-btn" data-mode="2" role="radio">2 Players</button>
      </div>
      <div id="actions">
        <button type="button" id="new-btn" class="btn">New game</button>
        <button type="button" id="clear-btn" class="btn ghost">Reset score</button>
      </div>
    </section>
  </div>
  <script src="./script.js"></script>
</body>
</html>
