<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="./style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<!-- partial:index.partial.html -->

<header>
    <h1>Tic Tac Toe</h1>
    <p>Turn: <span id="player-turn"></span></p>
  </header>
  <main id="gameboard">
    <div class="line r r-1"></div>
    <div class="line r r-2"></div>
    <div class="line c c-1"></div>
    <div class="line c c-2"></div>
  </main>
  <div id="num-of-players">
    <p>1 Player</p>
    <div id="toggle-switch" role="button" aria-label="Switch between 1 player and 2 players">
      <div id="toggle-btn"></div>
    </div>
    <p>2 Players</p>
  </div>
  <div id="gameover-msg">
    
    <button id="reset-btn"><h3 id="winner"></h3>New game</button>
  </div>
<!-- partial -->
  <script  src="./script.js"></script>

</body>
</html>
